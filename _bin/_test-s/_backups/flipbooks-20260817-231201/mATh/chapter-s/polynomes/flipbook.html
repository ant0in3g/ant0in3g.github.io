<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polynômes — flipbook | Antoine Géré</title>
<meta name="description" content="Cours de mathématiques : Polynômes, présenté en flipbook. ISTOM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/site.css">
<style>
  .layout{max-width:1760px;grid-template-columns:200px 1fr;gap:40px}
  .bookmain{max-width:none}
  .book-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .book-wrap{display:block;width:100%;margin:0 auto}
  #flip{margin:0 auto}
  #flip .page{background:#fff}
  #flip img{width:100%;height:100%;display:block}
  .book-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 6px}
  .bk-btn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.04em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer;transition:border-color .15s}
  .bk-btn:hover{border-color:var(--accent);color:var(--accent)}
  .bk-btn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--muted)}
  .bk-count{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted);min-width:96px;text-align:center}
  .book-loading{text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:60px 0}
  .book-hint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:4px}
</style>
</head>
<body>
<button class="toggle" id="themeToggle" aria-label="Changer de thème">◑</button>

<div class="layout">
  <aside>
    <a class="back" href="../../../mATh.html">← Mathématiques</a>
    <p class="brand sm">Polynômes</p>
    <p class="role">Polynômes · ISTOM</p>
    <div class="side-contact" style="margin-top:18px">
      <a href="https://ant0in3g.github.io/mATh/chapter-s/polynomes/chapter-s.pdf" target="_blank" rel="noopener">↓ Télécharger le PDF</a><br>
      <a href="flipbook-td.html">↳ feuille de TD</a>
    </div>
  </aside>

  <main class="bookmain">
    <div class="book-top">
      <h1 class="page-title" style="font-size:1.9rem;margin:0">Polynômes</h1>
    </div>

    <div class="book-wrap">
      <div id="flip"></div>
    </div>
    <div class="book-loading" id="loading">Chargement du document…</div>

    <div class="book-controls" id="controls" style="display:none">
      <button class="bk-btn" id="prev">‹ Précédent</button>
      <span class="bk-count" id="count">–</span>
      <button class="bk-btn" id="next">Suivant ›</button>
    </div>
    <p class="book-hint" id="hint" style="display:none">Cliquez le coin d'une page ou utilisez les flèches du clavier.</p>
  </main>
</div>

<script src="../../../assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  var PDF_URL="https://ant0in3g.github.io/mATh/chapter-s/polynomes/chapter-s.pdf";
  var loadingEl=document.getElementById('loading'),
      controls=document.getElementById('controls'),
      hint=document.getElementById('hint'),
      countEl=document.getElementById('count'),
      prevBtn=document.getElementById('prev'),
      nextBtn=document.getElementById('next');
  var pageFlip=null,total=0;

  if(!window.pdfjsLib){loadingEl.textContent="Impossible de charger la visionneuse.";return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function setCount(cur){
    if(total<=0)return;
    var right=cur+1;
    if(cur===0){countEl.textContent="1 / "+total;}
    else if(right>=total){countEl.textContent=total+" / "+total;}
    else{countEl.textContent=(cur+1)+"–"+(right+1)+" / "+total;}
    prevBtn.disabled=(cur<=0);
    nextBtn.disabled=(cur>=total-1);
  }

  pdfjsLib.getDocument(PDF_URL).promise.then(function(pdf){
    total=pdf.numPages;
    var images=new Array(total), ratio=1.414, done=0;
    var chain=Promise.resolve();
    for(let i=1;i<=total;i++){
      chain=chain.then(function(){
        return pdf.getPage(i).then(function(page){
          var vp=page.getViewport({scale:2.2});
          if(i===1)ratio=vp.height/vp.width;
          var canvas=document.createElement('canvas');
          canvas.width=vp.width;canvas.height=vp.height;
          return page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise.then(function(){
            images[i-1]=canvas.toDataURL('image/jpeg',0.82);
            done++;loadingEl.textContent="Rendu des pages… "+done+" / "+total;
          });
        });
      });
    }
    chain.then(function(){ initFlip(images,ratio); });
  }).catch(function(e){
    loadingEl.innerHTML='Le document n\'a pas pu être chargé ici. Vous pouvez l\'ouvrir directement : <a href="'+PDF_URL+'" target="_blank" rel="noopener">le PDF</a>.<br><span style="font-size:.75rem">(La visionneuse fonctionne sur le site publié.)</span>';
  });

  function initFlip(images,ratio){
    var baseW=760, baseH=Math.round(baseW*ratio);
    var el=document.getElementById('flip');
    pageFlip=new St.PageFlip(el,{
      width:baseW,height:baseH,
      size:"stretch",minWidth:320,maxWidth:820,
      minHeight:Math.round(320*ratio),maxHeight:Math.round(820*ratio),
      drawShadow:true,flippingTime:700,usePortrait:true,showCover:true,
      autoSize:true,mobileScrollSupport:true,maxShadowOpacity:0.5
    });
    pageFlip.loadFromImages(images);
    loadingEl.style.display='none';
    controls.style.display='flex';
    hint.style.display='block';
    setCount(0);
    pageFlip.on('flip',function(e){setCount(e.data);});
  }

  prevBtn.addEventListener('click',function(){if(pageFlip)pageFlip.flipPrev();});
  nextBtn.addEventListener('click',function(){if(pageFlip)pageFlip.flipNext();});
  document.addEventListener('keydown',function(e){
    if(!pageFlip)return;
    if(e.key==='ArrowLeft')pageFlip.flipPrev();
    if(e.key==='ArrowRight')pageFlip.flipNext();
  });
})();
</script>
</body>
</html>
