<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quel test statistique choisir ? | Antoine Géré</title>
<meta name="description" content="Explorateur interactif : répondez à quelques questions et trouvez le test statistique adapté, avec sa fonction R. ISTOM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  .explorer{margin-top:8px}
  .crumbs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;min-height:20px}
  .crumb{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:20px}
  .qstep .qtitle{font-weight:600;font-size:1.25rem;margin:0 0 16px}
  .qopts{display:grid;gap:10px}
  .qopt{text-align:left;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;cursor:pointer;transition:border-color .15s,background .15s;line-height:1.45}
  .qopt:hover{border-color:var(--accent)}
  .qopt .oh{font-weight:600;display:block}
  .qopt .od{color:var(--muted);font-size:.88rem}
  .restart{margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
  .restart:hover{color:var(--accent)}
  .result .rlead{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
</style>
</head>
<body>
<button class="toggle" id="themeToggle" aria-label="Changer de thème">◑</button>

<div class="layout">
  <aside>
    <a class="back" href="../../sTa7.html">← Statistiques</a>
    <p class="brand sm">Quel test ?</p>
    <p class="role">Assistant · ISTOM</p>
    <nav>
      <a href="fiches.html">Aide-mémoire complet</a>
    </nav>
    <div class="side-contact" style="margin-top:18px">
      <a href="mailto:a.gere@istom.fr">a.gere@istom.fr</a>
    </div>
  </aside>

  <main>
    <h1 class="page-title">Quel test choisir ?</h1>
    <p class="teacher">Répondez aux questions — l'assistant vous oriente vers le test adapté.</p>

    <div class="explorer">
      <div class="crumbs" id="crumbs"></div>
      <div id="panel"></div>
      <button class="restart" id="restart" style="display:none">↻ Recommencer</button>
    </div>
  </main>
</div>

<script src="../../assets/app.js"></script>
<script>
(function(){
  var FICHES = "fiches.html";
  // --- Terminal recommendations ---
  var TESTS = {
    shapiro:{name:"Shapiro-Wilk", tag:"paramétrique", fn:"shapiro.test(x)",
      when:"Vérifier qu'une variable numérique suit une loi normale. H₀ = données normales ; p > 0,05 → normalité non rejetée.", anchor:"normalite"},
    levene:{name:"Levene (ou Bartlett)", tag:"", fn:"leveneTest(y ~ groupe, data)",
      when:"Vérifier l'égalité des variances entre groupes. H₀ = variances égales ; p > 0,05 → homogénéité non rejetée. Bartlett si les données sont bien normales.", anchor:"variances"},
    t1:{name:"Test t à un échantillon", tag:"paramétrique", fn:"t.test(x, mu = valeur)",
      when:"Comparer la moyenne d'un échantillon à une valeur de référence. Suppose la normalité.", anchor:"ttest"},
    t2:{name:"Test t sur deux groupes indépendants", tag:"paramétrique", fn:"t.test(y ~ groupe, data)",
      when:"Comparer les moyennes de deux groupes indépendants. Suppose normalité et homogénéité des variances.", anchor:"ttest"},
    tpair:{name:"Test t apparié", tag:"paramétrique", fn:"t.test(before, after, paired = TRUE)",
      when:"Comparer deux mesures appariées (avant/après sur les mêmes individus). Suppose la normalité des différences.", anchor:"ttest"},
    mann:{name:"Mann-Whitney", tag:"non param.", fn:"wilcox.test(x, y, paired = FALSE)",
      when:"Équivalent non-paramétrique du test t sur deux groupes indépendants, quand la normalité n'est pas satisfaite.", anchor:"mann"},
    wilcox:{name:"Wilcoxon (rangs signés)", tag:"non param.", fn:"wilcox.test(x, y, paired = TRUE)",
      when:"Équivalent non-paramétrique du test t apparié.", anchor:"wilcoxon"},
    anova:{name:"ANOVA (+ Tukey HSD)", tag:"paramétrique", fn:"aov(y ~ facteur, data)",
      when:"Comparer les moyennes de trois groupes ou plus. Vérifier normalité des résidus et homogénéité des variances ; si significatif, TukeyHSD() pour les paires.", anchor:"anova"},
    kruskal:{name:"Kruskal-Wallis", tag:"non param.", fn:"kruskal.test(y ~ groupe)",
      when:"Équivalent non-paramétrique de l'ANOVA à un facteur : plus de deux groupes, sans hypothèse de normalité.", anchor:"kruskal"},
    pearson:{name:"Corrélation de Pearson", tag:"paramétrique", fn:'cor.test(x, y, method = "pearson")',
      when:"Mesurer une liaison linéaire entre deux variables quantitatives (suppose la normalité).", anchor:"correlation"},
    spearman:{name:"Corrélation de Spearman / Kendall", tag:"non param.", fn:'cor.test(x, y, method = "spearman")',
      when:"Mesurer une liaison monotone sur les rangs : robuste, sans hypothèse de normalité.", anchor:"correlation"},
    lm:{name:"Régression linéaire multiple", tag:"paramétrique", fn:"lm(y ~ x1 + x2, data)",
      when:"Modéliser et prédire une réponse quantitative à partir d'une ou plusieurs variables explicatives.", anchor:"regression"},
    chi_adeq:{name:"Khi-deux d'ajustement", tag:"non param.", fn:"chisq.test(counts, p = props)",
      when:"Vérifier si des effectifs observés suivent une distribution attendue. Effectifs théoriques ≥ 5.", anchor:"chi2"},
    chi_indep:{name:"Khi-deux d'indépendance", tag:"non param.", fn:"chisq.test(table(v1, v2))",
      when:"Tester l'association entre deux variables qualitatives (table de contingence). Effectifs théoriques ≥ 5.", anchor:"chi2"},
    binom:{name:"Test binomial", tag:"non param.", fn:"binom.test(k, n, p)",
      when:"Comparer une proportion observée (k succès sur n) à une proportion théorique.", anchor:"binom"},
    acp:{name:"Analyse en composantes principales (ACP)", tag:"", fn:"prcomp(data, scale. = TRUE)",
      when:"Résumer de nombreuses variables quantitatives en quelques axes pour explorer et visualiser la structure des données.", anchor:"acp"},
    cah:{name:"Classification ascendante hiérarchique (CAH)", tag:"", fn:'hclust(dist(scale(data)), method = "ward.D2")',
      when:"Regrouper les individus en classes homogènes selon leur ressemblance (dendrogramme).", anchor:"cah"}
  };

  // --- Decision tree ---
  var TREE = {
    start:{q:"Quel est votre objectif ?", opts:[
      {h:"Comparer des moyennes / des groupes", d:"Une moyenne, ou plusieurs groupes à comparer.", next:"cmp_n"},
      {h:"Vérifier un prérequis", d:"Normalité d'une variable ou égalité des variances.", next:"prereq"},
      {h:"Mesurer une liaison entre deux variables", d:"Corrélation ou modélisation.", next:"liaison"},
      {h:"Analyser des effectifs / proportions", d:"Données qualitatives ou variable binaire.", next:"cat"},
      {h:"Explorer / réduire / classer", d:"Beaucoup de variables ou regroupement d'individus.", next:"multi"}
    ]},
    prereq:{q:"Quel prérequis voulez-vous tester ?", opts:[
      {h:"La normalité d'une variable", d:"", result:"shapiro"},
      {h:"L'égalité des variances entre groupes", d:"", result:"levene"}
    ]},
    cmp_n:{q:"Combien de groupes comparez-vous ?", opts:[
      {h:"Une moyenne vs une valeur de référence", d:"Un seul échantillon.", result:"t1"},
      {h:"Deux groupes", d:"", next:"cmp2_pair"},
      {h:"Trois groupes ou plus", d:"", next:"cmp3_norm"}
    ]},
    cmp2_pair:{q:"Les deux groupes sont-ils appariés ?", opts:[
      {h:"Indépendants", d:"Deux échantillons distincts.", next:"cmp2i_norm"},
      {h:"Appariés", d:"Mêmes individus (avant/après).", next:"cmp2p_norm"}
    ]},
    cmp2i_norm:{q:"Les données sont-elles normales ?", opts:[
      {h:"Oui (normalité vérifiée)", d:"", result:"t2"},
      {h:"Non / incertain", d:"", result:"mann"}
    ]},
    cmp2p_norm:{q:"Les différences sont-elles normales ?", opts:[
      {h:"Oui (normalité vérifiée)", d:"", result:"tpair"},
      {h:"Non / incertain", d:"", result:"wilcox"}
    ]},
    cmp3_norm:{q:"Normalité des résidus et variances homogènes ?", opts:[
      {h:"Oui (conditions réunies)", d:"", result:"anova"},
      {h:"Non / incertain", d:"", result:"kruskal"}
    ]},
    liaison:{q:"Que voulez-vous faire ?", opts:[
      {h:"Mesurer une liaison linéaire (données normales)", d:"", result:"pearson"},
      {h:"Mesurer une liaison sur les rangs (robuste)", d:"", result:"spearman"},
      {h:"Modéliser / prédire une variable quantitative", d:"", result:"lm"}
    ]},
    cat:{q:"Quelle est votre question ?", opts:[
      {h:"Des effectifs suivent-ils une distribution attendue ?", d:"Test d'ajustement.", result:"chi_adeq"},
      {h:"Deux variables qualitatives sont-elles liées ?", d:"Test d'indépendance.", result:"chi_indep"},
      {h:"Une proportion (variable binaire) vs une valeur", d:"", result:"binom"}
    ]},
    multi:{q:"Que cherchez-vous à faire ?", opts:[
      {h:"Résumer / réduire de nombreuses variables", d:"Structure des variables.", result:"acp"},
      {h:"Regrouper les individus en classes", d:"Ressemblance entre individus.", result:"cah"}
    ]}
  };

  var panel=document.getElementById('panel'), crumbs=document.getElementById('crumbs'), restart=document.getElementById('restart');
  var trail=[];

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function renderCrumbs(){
    crumbs.innerHTML = trail.map(function(t){return '<span class="crumb">'+t+'</span>';}).join('');
  }

  function showStep(key){
    var node=TREE[key];
    var html='<div class="qstep"><p class="qtitle">'+node.q+'</p><div class="qopts">';
    node.opts.forEach(function(o,i){
      html+='<button class="qopt" data-i="'+i+'"><span class="oh">'+o.h+'</span>'+(o.d?'<span class="od">'+o.d+'</span>':'')+'</button>';
    });
    html+='</div></div>';
    panel.innerHTML=html;
    restart.style.display = trail.length ? 'inline-block' : 'none';
    Array.prototype.forEach.call(panel.querySelectorAll('.qopt'),function(btn){
      btn.addEventListener('click',function(){
        var o=node.opts[+btn.getAttribute('data-i')];
        trail.push(o.h); renderCrumbs();
        if(o.result){ showResult(o.result); } else { showStep(o.next); }
      });
    });
  }

  function showResult(id){
    var t=TESTS[id];
    var tag = t.tag ? ' <span class="'+(t.tag.indexOf('non')===0?'tag-np':'tag-p')+'">'+t.tag+'</span>' : '';
    panel.innerHTML =
      '<div class="result">'+
        '<p class="rlead">Test recommandé</p>'+
        '<div class="fiche">'+
          '<div class="fiche-head"><span class="ft">'+t.name+tag+'</span><code class="fiche-fn">'+esc(t.fn)+'</code></div>'+
          '<div class="fiche-grid one"><div><span class="flabel">Pourquoi</span>'+t.when+'</div></div>'+
          '<div class="fx"><pre><code>'+esc(t.fn)+'</code></pre></div>'+
          '<p style="margin:12px 0 0;font-size:.9rem"><a href="'+FICHES+'#'+t.anchor+'">→ Voir la fiche détaillée</a></p>'+
        '</div>'+
      '</div>';
    restart.style.display='inline-block';
  }

  function reset(){ trail=[]; renderCrumbs(); showStep('start'); }
  restart.addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
